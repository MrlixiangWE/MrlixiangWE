name: profile

on:
  schedule:
    - cron: "17 2,10,18 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render the contribution field and cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/render_contrib3d.py
          python3 scripts/render_cards.py
      - name: Commit
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "mrdanaer@gmail.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: refresh profile"
          git push
